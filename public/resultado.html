<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resultado - Exploração do Oceano</title>

  <style>
    :root {
      --bg:#e6f7fb;
      --card:#ffffff;
      --text:#053642;
      --muted:#264653;
      --accent:#2a9d8f;
      --accent-2:#e76f51;
      --glass: rgba(255,255,255,0.5);
      --shadow: 0 6px 18px rgba(3, 37, 44, 0.12);
      --radius:14px;
      --transition: 250ms cubic-bezier(.2,.9,.3,1);
    }

    html.dark {
      --bg:#042027;
      --card:#052b2a;
      --text:#e6f7fb;
      --muted:#cfecec;
      --accent:#8bd3c9;
      --accent-2:#ffb59b;
      --glass: rgba(6,22,22,0.5);
      --shadow: 0 8px 22px rgba(0,0,0,0.6);
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Inter, "Segoe UI", Roboto, Arial;
      text-align: center;
      background: linear-gradient(180deg, var(--bg), rgba(255,255,255,0.4));
      color: var(--text);
    }

    h1 { margin-bottom: 8px; }
    h2 { color: var(--accent); }
    p { margin-top: 0; margin-bottom: 20px; font-size: 1.2rem; color: var(--muted); }

    .card {
      display: inline-block;
      background: var(--glass);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(6px);
    }

    .card img {
      max-width: 350px;
      border-radius: 12px;
      display: block;
      margin: 0 auto 20px auto;
    }

    button {
      padding: 12px 22px;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
      box-shadow: 0 6px 14px rgba(42,157,143,0.25);
    }

    button:hover {
      transform: translateY(-2px);
      background: var(--accent-2);
    }
  </style>
</head>

<body>
  <h1>🌊 Emoção detectada:</h1>
  <h2 id="emocaoTitle">Processando...</h2>
  <p id="confTitle"></p>

  <div class="card">
    <img id="imagemEmocao" alt="Imagem relacionada à emoção" />
    <button onclick="voltar()">Voltar</button>
  </div>

  <script>
    const imagensPorEmocao = {
      feliz: ['static/mar_feliz/1.png'],
      triste: ['static/mar_triste/1.png'],
      neutro: ['static/mar_neutro/1.png']
    };

    const traducoes = {
      happy: 'feliz',
      sad: 'triste',
      neutral: 'neutro',
      angry: 'triste',
      fearful: 'triste',
      disgusted: 'triste',
      surprised: 'feliz'
    };

    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function imagemAleatoria(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    const emocaoOriginal = getQueryParam('emocao') || 'neutral';
    const conf = getQueryParam('conf') || '0';
    const emocaoTraduzida = traducoes[emocaoOriginal] || 'nenhuma';

    document.getElementById('emocaoTitle').innerText =
      emocaoTraduzida.charAt(0).toUpperCase() + emocaoTraduzida.slice(1);

    document.getElementById('confTitle').innerText = `Confiança: ${conf}%`;

    if (imagensPorEmocao[emocaoTraduzida]) {
      document.getElementById('imagemEmocao').src =
        imagemAleatoria(imagensPorEmocao[emocaoTraduzida]);
    } else {
      document.getElementById('imagemEmocao').style.display = 'none';
    }

    function voltar() {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
